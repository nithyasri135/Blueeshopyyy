<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blueeshopyyy- E-Commerce</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


<header class="header">

    <div class="logo">
        🛍️ Blueeshopyyy
    </div>

    <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#checkout">Checkout</a>
    </nav>

    <div class="header-actions">
        <button id="themeBtn">🌙</button>

        <button id="wishlistBtn">
            ❤️ <span id="wishlistCount">0</span>
        </button>

        <button id="cartBtn">
            🛒 <span id="cartCount">0</span>
        </button>
    </div>

</header>


<section class="hero" id="home">

    <div class="hero-content">

        <h1>Welcome to Blueeshopyyy</h1>

        <p>
            Discover amazing products at affordable prices.
        </p>

        <button onclick="scrollToProducts()">
            Shop Now
        </button>

    </div>

</section>



<section class="products-section" id="products">

    <h2>Our Products</h2>


    <div class="controls">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search products..."
        >

        <select id="categoryFilter">

            <option value="all">
                All Categories
            </option>

            <option value="electronics">
                Electronics
            </option>

            <option value="fashion">
                Fashion
            </option>

            <option value="shoes">
                Shoes
            </option>

            <option value="accessories">
                Accessories
            </option>

        </select>


        <select id="sortPrice">

            <option value="default">
                Sort by Price
            </option>

            <option value="low">
                Low → High
            </option>

            <option value="high">
                High → Low
            </option>

        </select>

    </div>


  

    <div id="productContainer" class="product-grid"></div>

</section>


<div id="cartSidebar" class="sidebar">

    <div class="sidebar-header">

        <h2>🛒 Your Cart</h2>

        <button onclick="closeCart()">✖</button>

    </div>


    <div id="cartItems"></div>


    <div class="cart-footer">

        <h3>
            Total:
            ₹<span id="cartTotal">0</span>
        </h3>

        <button onclick="goToCheckout()">
            Checkout
        </button>

    </div>

</div>



<div id="wishlistSidebar" class="sidebar">

    <div class="sidebar-header">

        <h2>❤️ Wishlist</h2>

        <button onclick="closeWishlist()">✖</button>

    </div>

    <div id="wishlistItems"></div>

</div>


<div id="productModal" class="modal">

    <div class="modal-content">

        <button class="close-modal" onclick="closeModal()">
            ✖
        </button>

        <div id="modalProduct"></div>

    </div>

</div>



<section class="checkout-section" id="checkout">

    <h2>Checkout</h2>

    <form id="checkoutForm">

        <div class="form-group">

            <label>
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
            >

            <small id="nameError"></small>

        </div>


        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >

            <small id="emailError"></small>

        </div>


        <div class="form-group">

            <label>
                Phone Number
            </label>

            <input
                type="text"
                id="phone"
                placeholder="10 digit phone number"
            >

            <small id="phoneError"></small>

        </div>


        <div class="form-group">

            <label>
                Address
            </label>

            <textarea
                id="address"
                placeholder="Enter your address"
            ></textarea>

            <small id="addressError"></small>

        </div>


        <button type="submit">
            Place Order
        </button>

    </form>

</section>


<footer>

    <p>
        @ Blueeshopyyy | HTML • CSS • JavaScript
    </p>

</footer>


<script src="script.js"></script>

</body>
</html>
